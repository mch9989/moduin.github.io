<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moduin.kr - 모두를 위한 IT & 자동화</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            background-color: #faf9f7; /* 따뜻하고 밝은 배경톤 */
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* 메인 컨테이너 */
        .main-container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            text-align: center;
        }

        /* 대표 이미지 영역 */
        .hero-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* 타이틀 및 소개 */
        h1 { font-size: 2.2rem; color: #2c3e50; margin-bottom: 10px; font-weight: 800; }
        p.desc { font-size: 1.1rem; color: #666; margin-bottom: 40px; line-height: 1.6; }

        /* 소통 버튼 그룹 (Flexbox) */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-2px); }
        
        .btn-subscribe { background-color: #d35400; } /* 뉴스레터 구독 (스티비 폼 링크 연결) */
        .btn-request { background-color: #27ae60; } /* 작업 의뢰 (구글 폼 링크 연결) */
        .btn-guestbook { background-color: #2980b9; } /* 방명록/댓글 (깃허브 이슈/디스커스 연결) */

        /* 하단 푸터 */
        footer { margin-top: auto; padding: 20px; color: #999; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 대문 이미지 (저장하신 파일 경로로 수정) -->
        <img src="main_img.png" alt="moduin.kr 서재 이미지" class="hero-image">
        
        <h1>moduin.kr</h1>
        <p class="desc">
            IT 업무 자동화, 스마트팩토리, 그리고 실용적인 개발 이야기.<br>
            당신의 시간을 아껴주는 기술을 공유합니다.
        </p>

        <!-- 소통 액션 버튼 (href 안의 주소를 나중에 발급받은 링크로 교체하시면 됩니다) -->
        <div class="action-buttons">
            <a href="https://stibee.com/안내받은구독폼링크" target="_blank" class="btn btn-subscribe">뉴스레터 구독하기</a>
            <a href="https://forms.gle/5Gk1uLgRWsm7SWMm9" target="_blank" class="btn btn-request">작업 의뢰 / 문의</a>
            <a href="https://github.com/mch9989/moduin.github.io/discussions" target="_blank" class="btn btn-guestbook">방명록 남기기</a>
        </div>
    </div>

    <footer>
        &copy; 2026 moduin.kr & PlatformWorks. All Rights Reserved.
    </footer>

</body>
</html>
